<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Gradiente Titanio Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Gradiente Pulso Neón (Cian Eléctrico a Rosa Carmesí) -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Forma Squircle Exterior (Estilo iOS / PWA) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Halo de Luz de Fondo -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="80" fill="#f43f5e" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Anillo Exterior Segmentado de Cuenta Regresiva -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" stroke-dasharray="12 18"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="80 320" stroke-linecap="round" opacity="0.85"/>

  <!-- Trazo Central: Electrocardiograma que Fluye hacia un Corazón Neón -->
  <path d="M 96 256 H 180 L 202 210 L 228 305 L 256 165 L 284 340 L 308 235 L 328 256 H 416" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Mini Corazón de Resplandor en la Cúspide -->
  <path d="M 256 195 C 248 180 230 180 222 192 C 214 204 222 220 256 248 C 290 220 298 204 290 192 C 282 180 264 180 256 195 Z" 
        fill="#f43f5e" filter="url(#neonGlow)"/>
</svg>
