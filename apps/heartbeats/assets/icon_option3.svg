<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Gradiente Aqua a Esmeralda Neón -->
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Exterior -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad3)"/>
  <rect x="6" y="6" width="500" height="500" rx="124" fill="none" stroke="rgba(6,182,212,0.18)" stroke-width="2"/>

  <!-- Dial Concéntrico Exterior de Precisión -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#aquaGrad)" stroke-width="12" stroke-dasharray="280 900" stroke-linecap="round" filter="url(#crispGlow)"/>

  <!-- Marcas de 60 divisiones del dial -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="3 14"/>

  <!-- Centro: Pulso Cardíaco Preciso con Aguja Luminosa -->
  <circle cx="256" cy="256" r="110" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.3)" stroke-width="2"/>
  
  <path d="M 175 256 H 220 L 235 220 L 256 295 L 275 235 L 290 256 H 335" 
        fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#crispGlow)"/>

  <!-- Aguja Indicadora de Tiempo Hacia Arriba (Hacia el Futuro) -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" filter="url(#crispGlow)"/>
  <circle cx="256" cy="256" r="10" fill="#f43f5e"/>
</svg>
