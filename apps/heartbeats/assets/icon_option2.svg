<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141328"/>
      <stop offset="100%" stop-color="#07070f"/>
    </linearGradient>

    <!-- Gradiente Dorado a Amatista -->
    <linearGradient id="goldPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Exterior -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)"/>
  <rect x="6" y="6" width="500" height="500" rx="124" fill="none" stroke="rgba(251,191,36,0.15)" stroke-width="2"/>

  <!-- Halo Cálido de Fondo -->
  <circle cx="256" cy="256" r="130" fill="#f59e0b" opacity="0.08" filter="url(#softGlow2)"/>

  <!-- Estructura del Reloj de Arena / Corazón Espejado -->
  <path d="M 160 140 H 352 L 280 240 C 295 248 310 262 310 285 C 310 325 270 355 256 368 C 242 355 202 325 202 285 C 202 262 217 248 232 240 Z" 
        fill="none" stroke="url(#goldPurpleGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" filter="url(#softGlow2)"/>

  <path d="M 160 372 H 352" stroke="url(#goldPurpleGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Partículas de Tiempo Cayendo -->
  <circle cx="256" cy="256" r="7" fill="#fbbf24" filter="url(#softGlow2)"/>
  <circle cx="256" cy="285" r="9" fill="#fb7185" filter="url(#softGlow2)"/>
  <circle cx="256" cy="320" r="14" fill="#a855f7" filter="url(#softGlow2)"/>

  <!-- Destello Estelar en la Esquina Superior -->
  <path d="M 330 150 L 335 165 L 350 170 L 335 175 L 330 190 L 325 175 L 310 170 L 325 165 Z" fill="#fbbf24"/>
</svg>
