<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Monogram Cyber Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="26" y="26" width="460" height="460" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Cyber M Monogram with Aurora Glow -->
  <path d="M 96 396 L 96 126 L 168 126 L 256 266 L 344 126 L 416 126 L 416 396 L 348 396 L 348 226 L 256 352 L 164 226 L 164 396 Z"
        fill="url(#auroraGrad)" filter="url(#neonGlow)"/>

  <!-- Pulse Node Apex Diamond -->
  <polygon points="256,388 274,406 256,424 238,406" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
