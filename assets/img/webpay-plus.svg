<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 28" width="100" height="28" fill="none">
  <!-- Pill Background -->
  <rect width="100" height="28" rx="6" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="99" height="27" rx="5.5" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Transbank Webpay Signature Twin Dots -->
  <circle cx="12" cy="14" r="3.5" fill="#FA5600"/>
  
  <!-- "webpay" Typography -->
  <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#1E293B" letter-spacing="-0.4px">webpay</text>
  
  <!-- Transbank "plus" Badge -->
  <rect x="67" y="6.5" width="26" height="15" rx="3.5" fill="#D81A3A"/>
  <text x="70" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" font-style="italic">plus</text>
  
  <!-- Transbank End Accent Dot -->
  <circle cx="96.5" cy="14" r="1.8" fill="#FA5600"/>
</svg>
